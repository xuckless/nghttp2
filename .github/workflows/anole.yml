name: anole

# The anole branch carries Anole's RFC 9113 strictness patch on a release
# tag. This builds the library alone, with AddressSanitizer and
# UndefinedBehaviorSanitizer, and runs nghttp2's unit tests, which cover
# the patch (tests/nghttp2_session_test.c).
on:
  push:
    branches: [anole, "anole-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq autoconf automake autotools-dev libtool pkg-config
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config
      - name: Configure (ASan and UBSan)
        run: |
          autoreconf -i
          ./configure --enable-lib-only --disable-dependency-tracking \
            CC=clang \
            CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g -O1" \
            LDFLAGS="-fsanitize=address,undefined"
      - name: make check
        env:
          ASAN_OPTIONS: detect_leaks=${{ runner.os == 'Linux' && '1' || '0' }}:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)" check
      - name: Test log on failure
        if: failure()
        run: cat tests/test-suite.log || true
